<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel del Asesor - Textilemprende</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #ffffff;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto 50px auto;
    }

    .service {
      background: #f5f5f5;
      padding: 25px;
      border-radius: 12px;
      transition: transform 0.2s ease;
      text-align: center;
    }

    .service:hover {
      transform: translateY(-5px);
    }

    .service img {
      width: 50px;
      height: 50px;
      margin-bottom: 15px;
    }

    .service p {
      color: #1e2c5e;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    @media (max-width: 600px) {
      .services {
        grid-template-columns: 1fr;
      }
    }

    .logo-textile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-textile div {
      line-height: 1.1;
    }

    .logo-textile small {
      font-size: 0.8rem;
      display: block;
      color: #555;
    }

    #contenido-dinamico {
      display: none;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand fw-bold logo-textile" href="#">
      <img src="https://img.icons8.com/ios-filled/40/1e2c5e/sewing-machine.png" alt="Logo Textil" />
      <div>
        TEXTILEMPRENDE<br>
        <small>FONDO DE EMPLEADOS</small>
      </div>
    </a>
    <div class="d-flex align-items-center gap-3">
      <span id="username" class="fw-bold text-dark"></span>
      <span>👤</span>
      <a href="/login" class="btn btn-outline-primary">Cerrar sesión</a>
    </div>
  </div>
</nav>

<main class="container text-center">
  <h2 class="text-primary mb-5">Panel del Asesor</h2>

  <div class="services">
    <button class="service-btn text-decoration-none" data-section="solicitudes">
      <div class="service">
        <img src="https://img.icons8.com/ios-filled/50/1e2c5e/document.png" alt="Solicitudes" />
        <p>Solicitudes<br>Asignadas</p>
      </div>
    </button>

    <button class="service-btn text-decoration-none" data-section="responder">
      <div class="service">
        <img src="https://img.icons8.com/ios-filled/50/1e2c5e/reply-arrow.png" alt="Responder" />
        <p>Responder<br>Solicitudes</p>
      </div>
    </button>
  </div>

  <div id="contenido-dinamico" class="mt-5 text-start p-4 border rounded bg-light"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
<script>
  const token = localStorage.getItem('token');
  if (token) {
    const decoded = jwt_decode(token);
    document.getElementById('username').textContent = decoded.nombre || decoded.correo || decoded.id_asesor || "Asesor";
  } else {
    document.getElementById('username').textContent = "Invitado";
  }
</script>

<script>
const botones = document.querySelectorAll('.service-btn');
const contenedor = document.getElementById('contenido-dinamico');

const secciones = {
  solicitudes: async () => {
  try {
    const token = localStorage.getItem('token');
    const res = await fetch('/api/asesor/infosolicitudes', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    const data = await res.json();

    let html = `
      <h4 class="mb-3">Solicitudes Asignadas</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Afiliado</th>
              <th>Fecha</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(ticket => `
              <tr>
                <td>${ticket.id_ticket}</td>
                <td>${ticket.nombre_afiliado}</td>
                <td>${new Date(ticket.fecha_creacion).toLocaleDateString()}</td>
                <td>${ticket.descripcion}</td>
                <td>${ticket.estado}</td>
                <td><button class="btn btn-sm btn-primary responder-btn" data-ticket='${JSON.stringify(ticket)}'>Responder</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    contenedor.innerHTML = html;
    contenedor.style.display = 'block';
    contenedor.scrollIntoView({ behavior: 'smooth' });

  } catch (error) {
    contenedor.innerHTML = '<p class="text-danger">Error al cargar las solicitudes.</p>';
    contenedor.style.display = 'block';
    console.error(error);
  }
}
,

  responder: () => {
    contenedor.innerHTML = `<p class="text-muted">Selecciona una solicitud para responder.</p>`;
    contenedor.style.display = 'block';
  }
};

botones.forEach(btn => {
  btn.addEventListener('click', () => {
    const seccion = btn.getAttribute('data-section');
    if (secciones[seccion]) {
      secciones[seccion]();
    }
  });
});
</script>

</body>
</html>
