<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel del Asesor - Textilemprende</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #ffffff;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto 50px auto;
    }

    .service {
      background: #f5f5f5;
      padding: 25px;
      border-radius: 12px;
      transition: transform 0.2s ease;
      text-align: center;
    }

    .service:hover {
      transform: translateY(-5px);
    }

    .service img {
      width: 50px;
      height: 50px;
      margin-bottom: 15px;
    }

    .service p {
      color: #1e2c5e;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    @media (max-width: 600px) {
      .services {
        grid-template-columns: 1fr;
      }
    }

    .logo-textile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-textile div {
      line-height: 1.1;
    }

    .logo-textile small {
      font-size: 0.8rem;
      display: block;
      color: #555;
    }

    #contenido-dinamico {
      display: none;
    }
    .table thead th {
  vertical-align: middle;
}

#chat-mensajes p {
  margin-bottom: 0.5rem;
  padding: 0.4rem 0.8rem;
  background: #e9ecef;
  border-radius: 10px;
  width: fit-content;
}

  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand fw-bold logo-textile" href="#">
      <img src="https://img.icons8.com/ios-filled/40/1e2c5e/sewing-machine.png" alt="Logo Textil" />
      <div>
        TEXTILEMPRENDE<br>
        <small>FONDO DE EMPLEADOS</small>
      </div>
    </a>
    <div class="d-flex align-items-center gap-3">
      <span id="username" class="fw-bold text-dark"></span>
      <span>👤</span>
      <a href="/login" class="btn btn-outline-primary">Cerrar sesión</a>
    </div>
  </div>
</nav>

<main class="container text-center">
  <h2 class="text-primary mb-5">Panel del Asesor</h2>

  <div class="services">
    <button class="service-btn text-decoration-none" data-section="info">
      <div class="service">
        <img src="https://img.icons8.com/ios-filled/50/1e2c5e/user-folder.png" alt="Información Personal" />
        <p>Información<br>Personal</p>
      </div>
    </button>

    <button class="service-btn text-decoration-none" data-section="solicitudes">
      <div class="service">
        <img src="https://img.icons8.com/ios-filled/50/1e2c5e/document.png" alt="Solicitudes" />
        <p>Solicitudes<br>Asignadas</p>
      </div>
    </button>

  </div>

  <div id="contenido-dinamico" class="mt-5 text-start p-4 border rounded bg-light"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
<script>
  let decoded = {};
  const token = localStorage.getItem('token');

  document.addEventListener('DOMContentLoaded', () => {
    const usernameEl = document.getElementById('username');
    if (token) {
      try {
        decoded = jwt_decode(token);
        usernameEl.textContent = decoded.nombre ;
      } catch (error) {
        console.error("Token inválido:", error);
        usernameEl.textContent = "Invitado";
      }
    } else {
      usernameEl.textContent = "Invitado";
    }
  });


const botones = document.querySelectorAll('.service-btn');
const contenedor = document.getElementById('contenido-dinamico');

const secciones = {
      info: async () => {
  contenedor.innerHTML = `
    <div class="info-personal">
      <h4 class="mb-4 text-primary">Información Personal</h4>
      <div class="info-item"><strong>Id:</strong> <span id="username-id"></span></div>
      <div class="info-item"><strong>Nombre:</strong> <span id="username-info"></span></div>
      <div class="info-item"><strong>Cédula:</strong> <span id="cedula"></span></div>
      <div class="info-item"><strong>Correo:</strong> <span id="correo"></span></div>
      <div class="info-item"><strong>Rol:</strong> <span id="rol"></span></div>
    </div>
  `;
  contenedor.style.display = 'block';
  contenedor.scrollIntoView({ behavior: 'smooth' });

  if (decoded) {
    document.getElementById('username-id').textContent = decoded.id_asesor;
    document.getElementById('username-info').textContent = decoded.nombre;
    document.getElementById('cedula').textContent = decoded.cedula;
    document.getElementById('correo').textContent = decoded.correo;
    document.getElementById('rol').textContent = decoded.rol;
  }
},
  solicitudes: async () => {
  try {
    const token = localStorage.getItem('token');
    const res = await fetch('/api/asesor/infosolicitudes', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    const data = await res.json();

let html = `
  <h4 class="mb-4 text-primary">📋 Solicitudes Asignadas</h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle shadow-sm rounded">
      <thead class="table-primary text-center">
        <tr>
          <th>ID</th>
          <th>Afiliado</th>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody class="text-center">
        ${data.map(ticket => `
          <tr>
            <td>${ticket.id_ticket}</td>
            <td>${ticket.nombre_afiliado}</td>
            <td>${new Date(ticket.fecha_creacion).toLocaleDateString()}</td>
            <td class="text-start">${ticket.descripcion}</td>
            <td>
              <span class="badge bg-${ticket.estado === 'Pendiente' ? 'warning' : 'success'} text-dark">
                ${ticket.estado}
              </span>
            </td>
            <td>
              <button class="btn btn-outline-primary btn-sm Responder-btn" data-ticket-id="${ticket.id_ticket}">
                <i class="bi bi-chat-left-text"></i> Responder
              </button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>

<!-- Modal Detalle + Chat -->
<div class="modal fade" id="modalDetalleTicket" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content border-0 shadow">
      
      <!-- Encabezado -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">📝 Detalle del Ticket</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      
      <!-- Cuerpo -->
      <div class="modal-body">
        <div class="mb-3"><strong>ID:</strong> <span id="detalle-id"></span></div>

        <div class="mb-3">
          <strong>Categoría:</strong>
          <select id="detalle-categoria" class="form-select">
            <option value="Pagos">Pagos</option>
            <option value="Estados de cuenta">Estados de cuenta</option>
            <option value="Solicitudes de crédito">Solicitudes de crédito</option>
          </select>
        </div>

        <div class="mb-3">
          <strong>Estado:</strong>
          <select id="detalle-estado" class="form-select">
            <option value="Pendiente">Pendiente</option>
            <option value="En Proceso">En Proceso</option>
            <option value="Resuelto">Resuelto</option>
          </select>
        </div>

        <div class="mb-3">
          <strong>Descripción:</strong>
          <span id="detalle-descripcion"></span>
        </div>

        <hr>

        <!-- Sección Chat -->
        <h6 class="text-primary">💬 Chat con asesor y administrador</h6>
        <div id="chat-mensajes" class="border p-3 mb-3 rounded bg-light" style="max-height: 300px; overflow-y: auto;">
          <p class="text-muted">Sin mensajes aún...</p>
        </div>

        <div class="input-group mb-4">
          <input type="text" id="mensaje-input" class="form-control" placeholder="Escribe tu mensaje..." />
          <button class="btn btn-primary" id="enviar-mensaje">
            <i class="bi bi-send"></i> Enviar
          </button>
        </div>

        <!-- Botón guardar cambios -->
        <div class="text-end">
          <button class="btn btn-success" id="guardar-cambios">
            <i class="bi bi-save"></i> Guardar Cambios
          </button>
        </div>
        
      </div>
    </div>
  </div>
</div>

`;



    contenedor.innerHTML = html;
    contenedor.style.display = 'block';
    contenedor.scrollIntoView({ behavior: 'smooth' });

      const modal = new bootstrap.Modal(document.getElementById('modalDetalleTicket'));

    document.querySelectorAll('.Responder-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id_ticket = btn.getAttribute('data-ticket-id');

        try {
const res = await fetch(`/api/tickets/${id_ticket}`, {
  headers: { 'Authorization': `Bearer ${token}` }
});

if (!res.ok) {
  const text = await res.text(); // útil para ver qué HTML se está recibiendo
  throw new Error(`HTTP ${res.status}: ${text}`);
}

const { ticket, mensajes } = await res.json();


          // Mostrar detalles
          document.getElementById('detalle-id').textContent = ticket.id_ticket;
          document.getElementById('detalle-categoria').value = ticket.categoria;
          document.getElementById('detalle-estado').value = ticket.estado;
          document.getElementById('detalle-descripcion').textContent = ticket.descripcion;

          // Mostrar mensajes en el minichat
const chatContainer = document.getElementById('chat-mensajes');
chatContainer.innerHTML = mensajes.map(msg => {
  let nombreRemitente = '';
  let tipoRemitente = '';

  if (msg.id_asesor) {
    nombreRemitente = msg.nombre_asesor || 'Asesor';
    tipoRemitente = '(asesor)';
  } else if (msg.id_administrador) {
    nombreRemitente = msg.nombre_administrador || 'Administrador';
    tipoRemitente = '(admin)';
  } else {
    nombreRemitente = msg.nombre_afiliado || 'Afiliado';
    tipoRemitente = '(afiliado)';
  }

  return `
    <div class="mensaje">
      <strong>${nombreRemitente} ${tipoRemitente}:</strong> ${msg.respuesta}
    </div>
  `;
}).join('');


          chatContainer.scrollTop = chatContainer.scrollHeight;

  document.getElementById('guardar-cambios').onclick = async () => {
  const nuevaCategoria = document.getElementById('detalle-categoria').value;
  const nuevoEstado = document.getElementById('detalle-estado').value;

  try {
    await fetch(`/api/asesor/modificar/tickets/${ticket.id_ticket}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        categoria: nuevaCategoria,
        estado: nuevoEstado
      })
    });

    alert('Cambios guardados exitosamente');
    btn.click(); // recargar detalles del ticket
  } catch (error) {
    console.error('Error al guardar cambios:', error);
    alert('Error al guardar los cambios');
  }
};


          // Enviar mensaje
          document.getElementById('enviar-mensaje').onclick = async () => {
            const input = document.getElementById('mensaje-input');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            await fetch(`/api/tickets/${ticket.id_ticket}/mensaje`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({ id_ticket: ticket.id_ticket, mensaje })
            });

            input.value = '';
            btn.click(); // recarga detalles y mensajes
          };

          modal.show();
        } catch (error) {
          console.error('Error al cargar detalles del ticket:', error);
        }
      });
    });
  } catch (error) {
    contenedor.innerHTML = '<p class="text-danger">Error al cargar las solicitudes.</p>';
    contenedor.style.display = 'block';
    console.error(error);
  }
},
};
botones.forEach(btn => {
    btn.addEventListener('click', () => {
      const seccion = btn.getAttribute('data-section');
      contenedor.innerHTML = secciones[seccion];
      contenedor.style.display = 'block';
      contenedor.scrollIntoView({ behavior: 'smooth' });
      if (secciones[seccion]) {
      secciones[seccion]();
    }
    });
  });

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
