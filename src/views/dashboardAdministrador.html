<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administrador - Textilemprende</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #ffffff;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto 50px auto;
    }

    .service {
      background: #f5f5f5;
      padding: 25px;
      border-radius: 12px;
      transition: transform 0.2s ease;
      text-align: center;
    }

    .service:hover {
      transform: translateY(-5px);
    }

    .service img {
      width: 50px;
      height: 50px;
      margin-bottom: 15px;
    }

    .service p {
      color: #1e2c5e;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    .help {
      background-color: #1e2c5e;
      color: white;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .help span {
      margin-left: 10px;
    }

    @media (max-width: 600px) {
      .services {
        grid-template-columns: 1fr;
      }
    }

    .logo-textile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-textile div {
      line-height: 1.1;
    }

    .logo-textile small {
      font-size: 0.8rem;
      display: block;
      color: #555;
    }

    #historialMensajes {
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
      background-color: #f8f9fa;
      border-radius: 10px;
    }

    .mensaje {
      display: flex;
      margin-bottom: 10px;
      max-width: 80%;
    }

    .mensaje.afiliado {
      justify-content: flex-start;
    }

    .mensaje.asesor {
      justify-content: flex-end;
      margin-left: auto;
    }

    .mensaje.admin {
      justify-content: center;
      margin-left: auto;
      margin-right: auto;
    }

    .mensaje .contenido {
      background-color: #e9ecef;
      border-radius: 15px;
      padding: 10px;
      position: relative;
    }

    .mensaje.asesor .contenido {
      background-color: #0d6efd;
      color: white;
    }

    .mensaje.admin .contenido {
      background-color: #ffc107;
      color: black;
    }

    .mensaje .texto {
      white-space: pre-wrap;
    }

    .mensaje .meta {
      font-size: 0.75rem;
      margin-top: 5px;
      opacity: 0.8;
    }
    .chat-box {
  background-color: #f0f2f5;
  max-height: 250px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bubble {
  max-width: 75%;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 0.95rem;
  position: relative;
  word-wrap: break-word;
}

.bubble.user {
  background-color: #d1e7dd;
  align-self: flex-end;
  border-bottom-right-radius: 0;
}

.bubble.admin {
  background-color: #e2e3e5;
  align-self: flex-start;
  border-bottom-left-radius: 0;
}

  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold logo-textile" href="#">
        <img src="https://img.icons8.com/ios-filled/40/1e2c5e/sewing-machine.png" alt="Logo Textil" />
        <div>
          TEXTILEMPRENDE<br>
          <small>FONDO DE EMPLEADOS</small>
        </div>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span id="username" class="fw-bold text-dark"></span>
        <span>👤</span>
        <a href="/login" class="btn btn-outline-primary">Cerrar sesión</a>
      </div>
    </div>
  </nav>

  <main class="container text-center">
    <h2 class="text-primary mb-5">Panel del Administrador</h2>

    <div class="services">
    <button class="service-btn text-decoration-none" data-section="info">
      <div class="service">
        <img src="https://img.icons8.com/ios-filled/50/1e2c5e/user-folder.png" alt="Información Personal" />
        <p>Información<br>Personal</p>
      </div>
    </button>
      
      <button class="service-btn text-decoration-none" data-section="clientes">
        <div class="service">
          <img src="https://img.icons8.com/ios-filled/50/1e2c5e/conference.png" alt="Clientes" />
          <p>Información<br>de Clientes</p>
        </div>
      </button>

      <button class="service-btn text-decoration-none" data-section="solicitudes">
        <div class="service">
          <img src="https://img.icons8.com/ios-filled/50/1e2c5e/document.png" alt="Solicitudes" />
          <p>Solicitudes<br>de Clientes</p>
        </div>
      </button>

      <button class="service-btn text-decoration-none" data-section="estadisticas">
        <div class="service">
          <img src="https://img.icons8.com/ios-filled/50/1e2c5e/bar-chart.png" alt="Estadísticas" />
          <p>Estadísticas<br>de Tickets</p>
        </div>
      </button>
    </div>

    <div id="contenido-dinamico" class="mt-5 text-start p-4 border rounded bg-light" style="display: none;"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script>
      let decoded = {};
  const token = localStorage.getItem('token');

  document.addEventListener('DOMContentLoaded', () => {
    const usernameEl = document.getElementById('username');
    if (token) {
      try {
        decoded = jwt_decode(token);
        usernameEl.textContent = decoded.nombre ;
      } catch (error) {
        console.error("Token inválido:", error);
        usernameEl.textContent = "Invitado";
      }
    } else {
      usernameEl.textContent = "Invitado";
    }
  });
    const botones = document.querySelectorAll('.service-btn');
    const contenedor = document.getElementById('contenido-dinamico');


    const secciones = {
      info: async () => {
  contenedor.innerHTML = `
    <div class="info-personal">
      <h4 class="mb-4 text-primary">Información Personal</h4>
      <div class="info-item"><strong>Id:</strong> <span id="username-id"></span></div>
      <div class="info-item"><strong>Nombre:</strong> <span id="username-info"></span></div>
      <div class="info-item"><strong>Cédula:</strong> <span id="cedula"></span></div>
      <div class="info-item"><strong>Correo:</strong> <span id="correo"></span></div>
      <div class="info-item"><strong>Rol:</strong> <span id="rol"></span></div>
    </div>
  `;
  contenedor.style.display = 'block';
  contenedor.scrollIntoView({ behavior: 'smooth' });

  if (decoded) {
    document.getElementById('username-id').textContent = decoded.id_administrador;
    document.getElementById('username-info').textContent = decoded.nombre;
    document.getElementById('cedula').textContent = decoded.cedula;
    document.getElementById('correo').textContent = decoded.correo;
    document.getElementById('rol').textContent = decoded.rol;
  }
},
      clientes: async () => {
        try {
          const res = await fetch('/api/admin/usuarios');
          const data = await res.json();

          let html = `
        <h4 class="mb-3">Información de Clientes</h4>
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-primary">
              <tr><th>ID</th><th>Nombre</th><th>Cédula</th><th>Correo</th></tr>
            </thead>
            <tbody>
              ${data.clientes.map(c => `
                <tr>
                  <td>${c.id}</td>
                  <td>${c.nombre}</td>
                  <td>${c.cedula}</td>
                  <td>${c.correo}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <h4 class="mt-5 mb-3">Información de Asesores</h4>
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-secondary">
              <tr><th>ID</th><th>Nombre</th><th>Cédula</th><th>Correo</th></tr>
            </thead>
            <tbody>
              ${data.asesores.map(a => `
                <tr>
                  <td>${a.id}</td>
                  <td>${a.nombre}</td>
                  <td>${a.cedula}</td>
                  <td>${a.correo}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

          contenedor.innerHTML = html;
          contenedor.style.display = 'block';
          contenedor.scrollIntoView({ behavior: 'smooth' });

        } catch (err) {
          console.error(err);
          contenedor.innerHTML = `<p class="text-danger">Error al cargar los datos.</p>`;
          contenedor.style.display = 'block';
        }
      },

      solicitudes: async () => {
        try {
          const [resTickets, resUsuarios] = await Promise.all([
            fetch('/api/admin/solicitudes'),
            fetch('/api/admin/usuarios')
          ]);
          const tickets = await resTickets.json();
          const asesores = (await resUsuarios.json()).asesores;

          let html = `
    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-4">Solicitudes de Soporte</h5>
            <div class="table-responsive">
              <table class="table align-middle table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Afiliado</th>
                    <th>Fecha</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Asesor</th>
                    <th>Prioridad</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  ${tickets.map(ticket => `
                    <tr>
                      <td>${ticket.id_ticket}</td>
                      <td>${ticket.nombre_afiliado}</td>
                      <td>${new Date(ticket.fecha_creacion).toLocaleDateString()}</td>
                      <td>${ticket.categoria}</td>
                      <td>${ticket.estado}</td>
                      <td>${ticket.nombre_asesor || 'Sin asignar'}</td>
                      <td>${ticket.prioridad || 'No definida'}</td>
                      <td>
                        <button class="btn btn-sm btn-primary modificar-btn" data-ticket='${JSON.stringify(ticket)}'>Modificar</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

<!-- Modal -->
<div class="modal fade" id="modalModificar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content rounded-4 shadow">
      <div class="modal-header bg-primary text-white rounded-top-4">
        <h5 class="modal-title">Modificar Solicitud</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body bg-light">
        <form id="formModificar">
          <input type="hidden" id="ticketId" />
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control rounded-3" id="descripcion" rows="3"></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Estado</label>
              <select class="form-select rounded-3" id="estado">
                <option value="Pendiente">Pendiente</option>
                <option value="En proceso">En proceso</option>
                <option value="Resuelto">Resuelto</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Prioridad</label>
              <select class="form-select rounded-3" id="prioridad">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Asignar Asesor</label>
            <select class="form-select rounded-3" id="asesor">
              <option value="">Sin asignar</option>
              ${asesores.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('')}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Historial de mensajes</label>
            <div id="historialMensajes" class="chat-box p-3 rounded-3">
              <div class="text-muted text-center">No hay mensajes aún.</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Respuesta del administrador</label>
            <textarea class="form-control rounded-3" id="respuesta" rows="2" placeholder="Escribe un mensaje..."></textarea>
          </div>

          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-outline-primary" id="btnEnviarMensaje">
              <i class="bi bi-send"></i> Enviar Mensaje
            </button>

            <button type="submit" class="btn btn-success">
              <i class="bi bi-save"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

    `;

          contenedor.innerHTML = html;
          contenedor.style.display = 'block';
          contenedor.scrollIntoView({ behavior: 'smooth' });

          // Activar modales
          const modal = new bootstrap.Modal(document.getElementById('modalModificar'));
          document.querySelectorAll('.modificar-btn').forEach(btn => {
btn.addEventListener('click', async () => {
  const ticket = JSON.parse(btn.getAttribute('data-ticket'));
  document.getElementById('ticketId').value = ticket.id_ticket;
  document.getElementById('descripcion').value = ticket.descripcion || '';
  document.getElementById('estado').value = ticket.estado || '';
  document.getElementById('asesor').value = asesores.find(a => a.nombre_asesor === ticket.nombre_asesor)?.id || '';
  document.getElementById('prioridad').value = ticket.prioridad || '';
  document.getElementById('respuesta').value = '';

  const token = localStorage.getItem('token');
  const decoded = jwt_decode(token);
  const id_administrador = decoded.id_administrador;

          // Mostrar mensajes en el minichat
                  const id_ticket = ticket.id_ticket;
        try {
          const res = await fetch(`/api/tickets/${id_ticket}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const { ticket, mensajes } = await res.json();
const chatContainer = document.getElementById('historialMensajes');
chatContainer.innerHTML = mensajes.map(msg => {
  let nombreRemitente = '';
  let tipoRemitente = '';

  if (msg.id_asesor) {
    nombreRemitente = msg.nombre_asesor || 'Asesor';
    tipoRemitente = '(asesor)';
  } else if (msg.id_administrador) {
    nombreRemitente = msg.nombre_administrador || 'Administrador';
    tipoRemitente = '(admin)';
  } else {
    nombreRemitente = msg.nombre_afiliado || 'Afiliado';
    tipoRemitente = '(afiliado)';
  }

  return `
    <div class="mensaje">
      <strong>${nombreRemitente} ${tipoRemitente}:</strong> ${msg.respuesta}
    </div>
  `;
}).join('');
} catch (error) {
          console.error('Error al cargar detalles del ticket:', error);
        }
  modal.show();
});

          });
document.getElementById('btnEnviarMensaje').addEventListener('click', async () => {
  const token = localStorage.getItem('token');
  const decoded = jwt_decode(token);
  const id_ticket = document.getElementById('ticketId').value;
  const mensaje = document.getElementById('respuesta').value;

  if (!mensaje) return alert('El mensaje no puede estar vacío.');

  try {
    const res = await fetch(`/api/tickets/${id_ticket}/mensaje`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        id_ticket,
        mensaje,
        id_administrador: decoded.id_administrador
      })
    });

    if (res.ok) {
      document.getElementById('respuesta').value = '';
      // Refrescar historial de mensajes
      const chatRes = await fetch(`/api/tickets/${id_ticket}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const { mensajes } = await chatRes.json();
      const chatContainer = document.getElementById('historialMensajes');
      chatContainer.innerHTML = mensajes.map(msg => {
        let nombre = msg.nombre_asesor || msg.nombre_administrador || msg.nombre_afiliado;
        let rol = msg.id_asesor ? '(asesor)' : msg.id_administrador ? '(admin)' : '(afiliado)';
        return `<div><strong>${nombre} ${rol}:</strong> ${msg.respuesta}</div>`;
      }).join('');
    } else {
      const err = await res.json();
      alert('Error al enviar mensaje: ' + (err.error || 'desconocido'));
    }
  } catch (err) {
    console.error(err);
    alert('Error al conectar con el servidor');
  }
});

          document.getElementById('formModificar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const decoded = jwt_decode(token);
            const id = document.getElementById('ticketId').value;
            const estado = document.getElementById('estado').value;
            const descripcion = document.getElementById('descripcion').value;
            const id_asesor = document.getElementById('asesor').value || null;
            const prioridad = document.getElementById('prioridad').value;
            const id_administrador = decoded.id_administrador;

            try {
              const res = await fetch(`/api/admin/solicitudes/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado, descripcion, id_asesor, respuesta, prioridad, id_administrador })
              });

              if (res.ok) {
                modal.hide();
                alert('Ticket actualizado correctamente');
                secciones.solicitudes(); // Recargar vista
              } else {
                const err = await res.json();
                alert('Error: ' + (err.error || 'No se pudo actualizar'));
              }
            } catch (error) {
              console.error(error);
              alert('Error al conectar con el servidor');
            }
          });


        } catch (err) {
          console.error(err);
          contenedor.innerHTML = `<p class="text-danger">Error al cargar las solicitudes.</p>`;
          contenedor.style.display = 'block';
        }
      }
      ,
   estadisticas: async () => {
  try {
    const res = await fetch('/api/tickets/estadisticas', {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      }
    });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        // El token no es válido o no tiene permisos
        console.error('Token inválido o expirado. Redirigiendo al login.');
        localStorage.removeItem('token'); // Elimina el token inválido
        window.location.href = '/login'; // Redirige a la página de login
        return; // Detiene la ejecución de la función
      }
      throw new Error(`HTTP error! status: ${res.status}`);
    }
    const data = await res.json();

    // Preparar los datos para Chart.js
    const labels = data.map(item => item.estado);
    const values = data.map(item => item.total);

    // Crear un elemento <canvas> donde se renderizará el gráfico
    const canvasId = 'estadisticasChart';
    let html = `
      <h4 class="mb-3">Estadísticas de Tickets por Estado</h4>
      <canvas id="${canvasId}"></canvas>
    `;
    contenedor.innerHTML = html;
    contenedor.style.display = 'block';
    contenedor.scrollIntoView({ behavior: 'smooth' });

    // Obtener el contexto del canvas y crear el gráfico
    const ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
      type: 'bar', // Puedes cambiar 'bar' por 'pie', 'line', etc.
      data: {
        labels: labels,
        datasets: [{
          label: 'Total de Tickets',
          data: values,
          backgroundColor: [
            'rgba(255, 99, 132, 0.7)',
            'rgba(54, 162, 235, 0.7)',
            'rgba(255, 206, 86, 0.7)',
            'rgba(75, 192, 192, 0.7)',
            'rgba(153, 102, 255, 0.7)',
            'rgba(255, 159, 64, 0.7)'
          ],
          borderColor: [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 206, 86, 1)',
            'rgba(75, 192, 192, 1)',
            'rgba(153, 102, 255, 1)',
            'rgba(255, 159, 64, 1)'
          ],
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Cantidad de Tickets'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Estado del Ticket'
            }
          }
        }
      }
    });

  } catch (error) {
    console.error('Error al obtener las estadísticas:', error);
    contenedor.innerHTML = `<p class="text-danger">Error al cargar las estadísticas de los tickets.</p>`;
    contenedor.style.display = 'block';
  }
},


    };


    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        const seccion = btn.getAttribute('data-section');
        const contenido = secciones[seccion];
        if (typeof contenido === 'function') {
          contenido();
        } else {
          contenedor.innerHTML = contenido;
          contenedor.style.display = 'block';
          contenedor.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });


  </script>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
